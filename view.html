<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px 16px 16px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #172b4d; background: #fff; }
  .sub { color: #626f86; font-size: 12px; margin: 0 0 12px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #626f86; margin: 16px 0 6px; }
  .card { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid #dcdfe4; border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: #fff; }
  .card:hover { background: #f1f2f4; }
  .name { flex: 1; min-width: 0; }
  .labels { display: flex; gap: 4px; margin-bottom: 3px; flex-wrap: wrap; }
  .lab { font-size: 11px; font-weight: 600; line-height: 16px; padding: 0 6px; border-radius: 3px; color: #172b4d; }
  .top { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .top .sub { flex: 1; margin: 0; }
  .btn { background: #0c66e4; color: #fff; border: 0; border-radius: 4px; padding: 6px 12px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #0055cc; }
  .btn.ghost { background: #f1f2f4; color: #172b4d; }
  .btn.ghost:hover { background: #dcdfe4; }
  .btn:disabled { opacity: .5; cursor: default; }
  form.new { border: 1px solid #dcdfe4; border-radius: 8px; padding: 12px; margin: 0 0 14px; background: #f7f8f9; display: none; }
  form.new.open { display: block; }
  form.new label.f { display: block; font-size: 11px; font-weight: 700; color: #626f86; text-transform: uppercase; letter-spacing: .03em; margin: 10px 0 4px; }
  form.new label.f:first-child { margin-top: 0; }
  form.new input[type=text], form.new textarea, form.new input[type=date], form.new input[type=time], form.new select {
    width: 100%; font: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid #8590a2; border-radius: 4px; background: #fff; color: #172b4d; }
  form.new textarea { min-height: 52px; resize: vertical; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; opacity: .55; color: #172b4d; }
  .chip.on { opacity: 1; border-color: #172b4d; }
  .person { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; padding: 3px 10px 3px 3px; border-radius: 14px; border: 2px solid #dcdfe4; background: #fff; cursor: pointer; opacity: .6; }
  .person.on { opacity: 1; border-color: #0c66e4; }
  .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .hint { color: #626f86; font-size: 12px; }
  .meta { color: #626f86; font-size: 12px; }
  .due { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; background: #f5cd47; color: #172b4d; }
  .due.over { background: #c9372c; color: #fff; }
  .due.later { background: #e9f2ff; color: #0055cc; }
  .av { width: 24px; height: 24px; border-radius: 50%; background: #dfe1e6 center/cover; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
  .tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #8590a2; background: #fff; flex: none; cursor: pointer; padding: 0; position: relative; }
  .tick:hover { border-color: #1f845a; background: #dcfff1; }
  .tick:hover::after, .card.done .tick::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #1f845a; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .card.done { opacity: .45; transition: opacity .3s; }
  .card.done .tick { border-color: #1f845a; background: #dcfff1; }
  .card.done .name { text-decoration: line-through; }
  .pts { font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 4px; background: #e9f2ff; color: #0055cc; white-space: nowrap; }
  .auth { display: flex; align-items: center; gap: 12px; background: #e9f2ff; border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; }
  .auth p { margin: 0; flex: 1; font-size: 13px; }
  .auth button { background: #0c66e4; color: #fff; border: 0; border-radius: 4px; padding: 7px 14px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .auth button:hover { background: #0055cc; }
  .err { color: #c9372c; font-size: 12px; margin: 0 0 8px; }
  .card { align-items: flex-start; }
  .card > .tick, .card > .pts, .card > .due, .card > .av { margin-top: 2px; }
  .desc { color: #44546f; font-size: 12px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
  .cm { color: #626f86; font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cm b { color: #44546f; font-weight: 600; }
  .open .desc { display: block; -webkit-line-clamp: unset; }
  .cmlist { margin-top: 6px; border-left: 2px solid #dcdfe4; padding-left: 8px; }
  .cmlist div { font-size: 12px; color: #44546f; margin-bottom: 5px; white-space: pre-line; }
  .cmlist span { color: #8590a2; }
  .more { font-size: 12px; color: #0c66e4; background: none; border: 0; padding: 0; margin-top: 3px; cursor: pointer; font-weight: 600; }
  .more:hover { text-decoration: underline; }
  .empty { color: #626f86; padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<div id="auth"></div>
<div class="top"><p class="sub" id="sub"></p><button class="btn" id="newBtn" type="button" style="display:none">+ New task</button></div>
<form class="new" id="newForm" autocomplete="off">
  <label class="f" for="nName">Task</label>
  <input type="text" id="nName" placeholder="What needs doing?" required>
  <label class="f" for="nDesc">Details</label>
  <textarea id="nDesc" placeholder="Optional: notes, links, KR it supports"></textarea>
  <div class="row2">
    <div><label class="f" for="nDate">Due date</label><input type="date" id="nDate" required></div>
    <div><label class="f" for="nTime">Time</label><input type="time" id="nTime" required></div>
    <div><label class="f" for="nList">List</label><select id="nList"></select></div>
  </div>
  <label class="f">Labels</label>
  <div class="chips" id="nLabels"></div>
  <label class="f">Owner</label>
  <div class="chips" id="nMembers"></div>
  <div class="actions">
    <button class="btn" type="submit" id="nSave">Create task</button>
    <button class="btn ghost" type="button" id="nCancel">Cancel</button>
    <span class="hint">The card opens next so you can set its hours.</span>
  </div>
</form>
<div id="out"></div>
<script>
  // The API key is a public identifier (Trello designs it to live in Power-Up code).
  // It only works from the allowed origin, and every action uses each person's own token,
  // which Trello stores privately for them. No secret is used or stored here.
  var APP = { appKey: '1545bc8076b21ee949786f8854e27424', appName: 'Trailblazer Quick Views', appAuthor: 'Trailblazer Marketing' };
  var AGILE_TOOLS = '59d4ef8cfea15a55b0086614';
  var t = window.TrelloPowerUp.iframe(APP);
  var api = t.getRestApi();
  var token = null, comments = {}, expanded = {}, hits = [], board = null, listsAll = [], meId = null, LISTNAME = {};
  var view = t.arg('view') || 'today';
  var COLORS = { green:'#4bce97', yellow:'#f5cd47', orange:'#fea362', red:'#f87168', purple:'#9f8fef', blue:'#579dff', sky:'#6cc3e0', lime:'#94c748', pink:'#e774bb', black:'#626f86' };
  var DESC = {
    today: 'Due today or overdue, not done.',
    nextday: 'Due in the next 24 hours, not done.',
    week: 'Due in the next 7 days, not done.',
    overdue: 'Past due and not done.'
  };

  function inView(due, now) {
    var d = new Date(due), end = new Date(now); end.setHours(23, 59, 59, 999);
    if (view === 'today') return d <= end;
    if (view === 'nextday') return d >= now && d - now <= 864e5;
    if (view === 'week') return d >= now && d - now <= 7 * 864e5;
    if (view === 'overdue') return d < now;
  }

  function fmt(d) {
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' +
           d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function esc(s) { var e = document.createElement('div'); e.textContent = s; return e.innerHTML; }

  function hours(n) { return (Math.round(n * 100) / 100) + ' h'; }

  function updateSub() {
    var open = hits.filter(function (c) { return !c.done; });
    var total = open.reduce(function (s, c) { return s + (c.points || 0); }, 0);
    var txt = DESC[view] + ' ' + open.length + (open.length === 1 ? ' card' : ' cards');
    if (token) txt += ' · ' + hours(total);
    document.getElementById('sub').textContent = txt + '. Click a card to open it.';
  }

  function plain(md) {
    return (md || '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`]{1,3}/g, '').replace(/^#+\s*/gm, '').trim();
  }
  function ago(iso) {
    var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function details(c) {
    var desc = plain(c.desc), cms = comments[c.id] || [], open = !!expanded[c.id], h = '';
    if (desc) h += '<div class="desc">' + esc(desc) + '</div>';
    if (cms.length && !open) h += '<div class="cm">💬 ' + cms.length + ' · <b>' + esc(cms[0].who) + ':</b> ' + esc(cms[0].text.replace(/\s+/g, ' ')) + '</div>';
    if (cms.length && open) h += '<div class="cmlist">' + cms.map(function (m) { return '<div><b>' + esc(m.who) + '</b> <span>' + ago(m.date) + '</span><br>' + esc(m.text) + '</div>'; }).join('') + '</div>';
    var long = desc.length > 120 || desc.split('\n').length > 2 || cms.length > 0;
    if (long) h += '<button type="button" class="more">' + (open ? 'Show less' : (cms.length ? 'Show more & all comments' : 'Show more')) + '</button>';
    return h;
  }

  function render(listName, now) {
    var out = document.getElementById('out');
    if (!hits.length) { out.innerHTML = '<div class="empty">Nothing here. Nice.</div>'; updateSub(); return; }
    var groups = {}, order = [];
    hits.forEach(function (c) { var n = listName[c.idList]; if (!groups[n]) { groups[n] = []; order.push(n); } groups[n].push(c); });
    var html = '';
    order.forEach(function (n) {
      html += '<h3>' + esc(n) + ' (' + groups[n].length + ')</h3>';
      groups[n].forEach(function (c) {
        var d = new Date(c.due), cls = d < now ? 'over' : (d - now > 864e5 ? 'later' : '');
        var labs = (c.labels || []).map(function (l) { return '<span class="lab" style="background:' + (COLORS[l.color] || '#dfe1e6') + (l.color === 'black' ? ';color:#fff' : '') + '">' + esc(l.name || '') + '</span>'; }).join('');
        var avs = (c.members || []).slice(0, 2).map(function (m) {
          var ini = (m.fullName || m.username || '?').split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
          return m.avatar ? '<span class="av" title="' + esc(m.fullName || '') + '" style="background-image:url(' + (/\.(png|jpe?g|gif)$/.test(m.avatar) ? m.avatar : m.avatar + '/50.png') + ')"></span>'
                          : '<span class="av" title="' + esc(m.fullName || '') + '">' + esc(ini) + '</span>';
        }).join('');
        html += '<div class="card" data-id="' + c.id + '">' +
                (token ? '<button class="tick" title="Mark complete" aria-label="Mark complete"></button>' : '') +
                '<div class="name' + (expanded[c.id] ? ' open' : '') + '">' + (labs ? '<div class="labels">' + labs + '</div>' : '') + esc(c.name) + details(c) + '</div>' +
                (c.points != null ? '<span class="pts">' + hours(c.points) + '</span>' : '') +
                '<span class="due ' + cls + '">' + (d < now ? 'Overdue · ' : '') + fmt(d) + '</span>' + avs + '</div>';
      });
    });
    out.innerHTML = html;
    updateSub();
  }

  function complete(row) {
    var id = row.getAttribute('data-id');
    var c = hits.filter(function (x) { return x.id === id; })[0];
    if (!c || c.done) return;
    c.done = true; row.classList.add('done'); updateSub();
    fetch('https://api.trello.com/1/cards/' + id + '?key=' + APP.appKey + '&token=' + token, {
      method: 'PUT', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'dueComplete=true'
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      // Done: drop it from this pop-up (the card itself is only marked complete, never deleted).
      setTimeout(function () {
        hits = hits.filter(function (x) { return x.id !== id; });
        render(LISTNAME, new Date());
      }, 600);
    }).catch(function () {
      c.done = false; row.classList.remove('done'); updateSub();
      var e = document.createElement('p'); e.className = 'err'; e.textContent = 'Could not mark "' + c.name + '" complete. Try again, or tick it on the card.';
      document.getElementById('out').prepend(e);
    });
  }

  function showAuthBanner() {
    document.getElementById('auth').innerHTML =
      '<div class="auth"><p>One-time step: allow Quick Views to tick off tasks and show hours for you.</p><button id="authBtn">Authorize</button></div>';
    document.getElementById('authBtn').onclick = function () {
      api.authorize({ scope: 'read,write', expiration: 'never' })
        .then(function () { document.getElementById('auth').innerHTML = ''; load(); })
        .catch(function () {});
    };
  }

  function loadPoints(boardId) {
    return fetch('https://api.trello.com/1/boards/' + boardId + '/cards?fields=id&pluginData=true&key=' + APP.appKey + '&token=' + token)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (cards) {
        var pts = {};
        cards.forEach(function (c) {
          (c.pluginData || []).forEach(function (p) {
            if (p.idPlugin !== AGILE_TOOLS) return;
            try { var v = JSON.parse(p.value).points; if (v != null && v !== '') pts[c.id] = Number(v); } catch (e) {}
          });
        });
        return pts;
      });
  }

  function loadComments(boardId) {
    return fetch('https://api.trello.com/1/boards/' + boardId + '/actions?filter=commentCard&limit=1000&memberCreator_fields=fullName&key=' + APP.appKey + '&token=' + token)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (acts) {
        var map = {};
        acts.forEach(function (a) {
          var id = a.data && a.data.card && a.data.card.id; if (!id) return;
          (map[id] = map[id] || []).push({ who: ((a.memberCreator || {}).fullName || 'Someone').split(' ')[0], text: a.data.text || '', date: a.date });
        });
        return map; // newest first, as Trello returns them
      });
  }

  function load() {
    Promise.all([
      t.cards('id', 'name', 'desc', 'due', 'dueComplete', 'idList', 'labels', 'members'),
      t.lists('id', 'name'),
      t.board('id', 'labels', 'members'),
      t.member('id'),
      api.isAuthorized().then(function (ok) { return ok ? api.getToken() : null; }).catch(function () { return null; })
    ]).then(function (r) {
      var cards = r[0], lists = r[1], boardId = r[2].id, now = new Date();
      board = r[2]; meId = r[3].id; listsAll = lists;
      token = r[4];
      var listName = {}; lists.forEach(function (l) { listName[l.id] = l.name; }); LISTNAME = listName;
      hits = cards.filter(function (c) { return c.due && !c.dueComplete && listName[c.idList] && listName[c.idList] !== 'Start Here' && inView(c.due, now); })
                  .sort(function (a, b) { return new Date(a.due) - new Date(b.due); });
      document.getElementById('newBtn').style.display = token ? '' : 'none';
      if (!token) { showAuthBanner(); render(listName, now); return; }
      render(listName, now);
      loadComments(boardId).then(function (m) { comments = m; render(listName, now); }).catch(function () {});
      loadPoints(boardId).then(function (pts) {
        hits.forEach(function (c) { if (pts[c.id] != null) c.points = pts[c.id]; });
        render(listName, now);
      }).catch(function () {
        // Token revoked or expired: ask again.
        token = null; showAuthBanner(); render(listName, now);
      });
    });
  }

  document.getElementById('out').addEventListener('click', function (e) {
    var row = e.target.closest('.card'); if (!row) return;
    if (e.target.closest('.tick')) { e.stopPropagation(); complete(row); return; }
    if (e.target.closest('.more')) {
      e.stopPropagation(); var id = row.getAttribute('data-id');
      if (expanded[id]) delete expanded[id]; else expanded[id] = 1;
      render(LISTNAME, new Date()); return;
    }
    t.showCard(row.getAttribute('data-id'));
  });

  // ---------- New task ----------
  var pick = { labels: {}, members: {} };
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function openForm() {
    var f = document.getElementById('newForm');
    var d = new Date();
    if (view === 'nextday') d.setDate(d.getDate() + 1);
    document.getElementById('nDate').value = ymd(d);
    document.getElementById('nTime').value = view === 'nextday' ? '09:00' : '17:00';
    // Lists: everything except Start Here; default To Dos.
    var sel = document.getElementById('nList');
    sel.innerHTML = listsAll.filter(function (l) { return l.name !== 'Start Here' && l.name !== 'OKRs'; })
      .map(function (l) { return '<option value="' + l.id + '"' + (l.name === 'To Dos' ? ' selected' : '') + '>' + esc(l.name) + '</option>'; }).join('');
    // Labels: department labels first; status labels (OKR-only) left out.
    var skip = { 'On track': 1, 'At risk': 1, 'Off track': 1 };
    pick.labels = {};
    document.getElementById('nLabels').innerHTML = (board.labels || []).filter(function (l) { return l.name && !skip[l.name]; })
      .map(function (l) { return '<button type="button" class="chip" data-id="' + l.id + '" style="background:' + (COLORS[l.color] || '#dfe1e6') + (l.color === 'black' ? ';color:#fff' : '') + '">' + esc(l.name) + '</button>'; }).join('');
    pick.members = {}; pick.members[meId] = 1;
    document.getElementById('nMembers').innerHTML = (board.members || []).map(function (m) {
      var on = m.id === meId ? ' on' : '';
      var img = m.avatar ? '<span class="av" style="background-image:url(' + (/\.(png|jpe?g|gif)$/.test(m.avatar) ? m.avatar : m.avatar + '/50.png') + ')"></span>' : '<span class="av">' + esc((m.fullName || '?')[0]) + '</span>';
      return '<button type="button" class="person' + on + '" data-id="' + m.id + '">' + img + esc((m.fullName || m.username || '').split(' ')[0]) + '</button>';
    }).join('');
    f.classList.add('open');
    document.getElementById('newBtn').style.display = 'none';
    document.getElementById('nName').focus();
  }

  function closeForm() {
    var f = document.getElementById('newForm');
    f.reset(); f.classList.remove('open');
    document.getElementById('newBtn').style.display = token ? '' : 'none';
  }

  document.getElementById('newBtn').onclick = openForm;
  document.getElementById('nCancel').onclick = closeForm;
  document.getElementById('nLabels').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    var id = b.getAttribute('data-id'); if (pick.labels[id]) delete pick.labels[id]; else pick.labels[id] = 1;
    b.classList.toggle('on');
  });
  document.getElementById('nMembers').addEventListener('click', function (e) {
    var b = e.target.closest('.person'); if (!b) return;
    var id = b.getAttribute('data-id'); if (pick.members[id]) delete pick.members[id]; else pick.members[id] = 1;
    b.classList.toggle('on');
  });

  document.getElementById('newForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('nName').value.trim(); if (!name) return;
    var due = new Date(document.getElementById('nDate').value + 'T' + document.getElementById('nTime').value);
    var body = new URLSearchParams({
      name: name,
      desc: document.getElementById('nDesc').value.trim(),
      due: due.toISOString(),
      idList: document.getElementById('nList').value,
      idLabels: Object.keys(pick.labels).join(','),
      idMembers: Object.keys(pick.members).join(','),
      pos: 'bottom'
    });
    var btn = document.getElementById('nSave'); btn.disabled = true; btn.textContent = 'Creating…';
    fetch('https://api.trello.com/1/cards?key=' + APP.appKey + '&token=' + token, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString()
    }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (card) {
        // Open the new card right away so its hours can be set (Power-ups → Story Points).
        // Trello only opens a card once it has loaded it, so wait until it appears, then open it.
        btn.textContent = 'Opening card…';
        var tries = 0;
        (function waitThenOpen() {
          t.cards('id').then(function (cs) {
            if (cs.some(function (c) { return c.id === card.id; })) return t.showCard(card.id);
            if (++tries < 30) return setTimeout(waitThenOpen, 500);
            btn.disabled = false; btn.textContent = 'Create task'; closeForm();
            var n = document.createElement('p'); n.className = 'hint';
            n.textContent = 'Created "' + card.name + '". Open it on the board to set its hours.';
            document.getElementById('out').prepend(n);
          });
        })();
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Create task';
        var n = document.createElement('p'); n.className = 'err'; n.textContent = 'Could not create the task. Check the fields and try again.';
        document.getElementById('newForm').prepend(n);
      });
  });

  load();
</script>
</body>
</html>
