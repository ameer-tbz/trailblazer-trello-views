<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trailblazer Quick Views</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
  // Adds Today / Due in next day / Due in next week / Overdue buttons to the board header.
  // Each opens a pop-up inside Trello listing the matching cards.
  var base = window.location.href.replace(/[^/]*$/, '');
  // Trello's 'dark' icon is shown on dark headers, so it uses the light-coloured file.
  function icon(name) { return { dark: base + name + '-light.svg', light: base + name + '-dark.svg' }; }

  var VIEWS = [
    { text: 'Today',            view: 'today',   icon: 'today' },
    { text: 'Due in next day',  view: 'nextday', icon: 'nextday' },
    { text: 'Due in next week', view: 'week',    icon: 'week' },
    { text: 'Overdue',          view: 'overdue', icon: 'overdue' }
  ];

  var APP = { appKey: '1545bc8076b21ee949786f8854e27424', appName: 'Trailblazer Quick Views', appAuthor: 'Trailblazer Marketing' };

  window.TrelloPowerUp.initialize({
    'board-buttons': function () {
      return VIEWS.map(function (v) {
        return {
          icon: icon(v.icon),
          text: v.text,
          callback: function (t) {
            // Opens a pop-up inside Trello, so it works in the desktop app and the browser.
            return t.modal({ url: './view.html?v=10', args: { view: v.view }, title: v.text, height: 640 });
          }
        };
      });
    }
  }, APP);
</script>
</body>
</html>
